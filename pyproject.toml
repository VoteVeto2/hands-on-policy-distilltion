[project]
name = "opd"
version = "0.1.0"
description = "Hands-on on-policy distillation and agentic RL for LLMs."
requires-python = ">=3.11"
dependencies = [
  "absl-py",
  "accelerate",
  "datasets",
  "jmespath",
  "ml-collections",
  "peft",
  "torch",
  "transformers>=5.2",
]

[project.optional-dependencies]
dev = ["pyink", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opd*"]

[tool.setuptools.package-data]
opd = ["testdata/*"]

# Google's Python formatter: Black with 2-space indents and 80 columns.
[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true
preview = true
target-version = ["py311"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
